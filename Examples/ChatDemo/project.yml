name: ChatDemo
options:
  bundleIdPrefix: com.litertlm.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  LiteRTLM:
    path: ../../

targets:
  ChatDemo:
    type: application
    platform: iOS
    sources:
      - ChatDemo
    info:
      path: ChatDemo/Info.plist
      properties:
        CFBundleDisplayName: ChatDemo
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Take photos to ask the AI about
        NSMicrophoneUsageDescription: Voice input for the chat
        NSSpeechRecognitionUsageDescription: Convert your speech to text
        NSPhotoLibraryUsageDescription: Select photos to ask the AI about
        UILaunchScreen: {}
    entitlements:
      path: ChatDemo/ChatDemo.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litertlm.example.chatdemo
        SWIFT_VERSION: "5.9"
        # Set your Apple Development Team ID here
        DEVELOPMENT_TEAM: ""
    postBuildScripts:
      - name: "Re-sign CLiteRTLM companion libraries"
        script: |
          # CLiteRTLM.framework ships a companion dylib that Xcode does not
          # automatically re-sign. Codesign it with the app identity so iOS
          # accepts it at launch time.
          DYLIB="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/CLiteRTLM.framework/libGemmaModelConstraintProvider.dylib"
          if [ -f "$DYLIB" ]; then
            /usr/bin/codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$DYLIB"
          fi
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - package: LiteRTLM
        product: LiteRTLMDownloader
