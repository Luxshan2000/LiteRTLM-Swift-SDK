name: ChatDemo
options:
  bundleIdPrefix: com.litertlm.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  LiteRTLM:
    path: ../../

targets:
  ChatDemo:
    type: application
    platform: iOS
    sources:
      - ChatDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.litertlm.example.chatdemo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: ""
        INFOPLIST_VALUES: |-
          NSCameraUsageDescription=Take photos to ask the AI about
          NSMicrophoneUsageDescription=Voice input for the chat
          NSSpeechRecognitionUsageDescription=Convert your speech to text
          NSPhotoLibraryUsageDescription=Select photos to ask the AI about
    entitlements:
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
      - package: LiteRTLM
        product: LiteRTLMDownloader
